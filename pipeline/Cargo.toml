[package]
name = "pipeline"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"

[[bin]]
name = "morflow"
path = "src/main.rs"

[dependencies]
core_types = { path = "../core_types" }
parser = { path = "../parser" }
libloading = "0.8"
abi_stable = "0.11"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "native-tls"] }
dirs = "6.0"
rich_rust = { version = "0.2.3", features = ["markdown"] }
ariadne = "0.5"
chumsky = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
tempfile = "3"
