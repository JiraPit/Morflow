[package]
name = "pipeline"
version = "0.1.3"
edition = "2021"

[[bin]]
name = "morflow"
path = "src/main.rs"

[dependencies]
core_types = { path = "../core_types" }
parser = { path = "../parser" }
libloading = "0.8"
abi_stable = "0.11"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "native-tls"] }
dirs = "6.0"
rich_rust = { version = "0.2.3", features = ["markdown"] }
ariadne = "0.5"
chumsky = "0.9"