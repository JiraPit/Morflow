name: Build and Release Action Packs

on:
  push:
    branches: [main]
    paths:
      - 'actions/**'
      - 'core_types/**'
      - 'plugins/*/src/interface.rs'
      - 'scripts/package_action.py'
      - 'scripts/detect_changed_actions.py'
      - 'scripts/build_pack.py'
      - 'scripts/native_targets.py'
      - 'scripts/merge_release_assets.py'
      - '.github/workflows/build-actions.yml'
  workflow_dispatch:
    inputs:
      action_pack:
        description: 'Action Pack to build (audio_basics, image_basics, base, or "all")'
        required: false
        default: 'all'
      action_name:
        description: 'Action Name to build (e.g. gain, resize, or "all")'
        required: false
        default: 'all'
      force_build:
        description: 'Force build even if version was not bumped'
        type: boolean
        default: false

concurrency:
  group: action-pack-publishing
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  detect-actions:
    name: Detect Actions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detector.outputs.matrix }}
      has_actions: ${{ steps.detector.outputs.has_actions }}
      packs: ${{ steps.detector.outputs.packs }}
      has_more: ${{ steps.detector.outputs.has_more }}
      remaining_count: ${{ steps.detector.outputs.remaining_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect Actions to Build
        id: detector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_BASE_SHA: ${{ github.event.before }}
        run: |
          python3 scripts/detect_changed_actions.py \
            --event "${{ github.event_name }}" \
            --pack "${{ github.event.inputs.action_pack || 'all' }}" \
            --action "${{ github.event.inputs.action_name || 'all' }}" \
            --force "${{ github.event.inputs.force_build || 'false' }}" \
            --limit 40 \
            --repo "${{ github.repository }}"

  build-action:
    name: Build ${{ matrix.action.name || format('{0} pack library', matrix.pack_library.pack) }} (${{ matrix.target.platform }})
    needs: detect-actions
    if: needs.detect-actions.outputs.has_actions == 'true'
    strategy:
      fail-fast: false
      matrix:
        # One entry per (action, platform) and per (pack library, mobile
        # platform) still missing from its release; targets are defined in
        # scripts/detect_changed_actions.py and scripts/native_targets.py.
        include: ${{ fromJson(needs.detect-actions.outputs.matrix) }}
    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}

      - name: Set up Python
        if: matrix.pack_library
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Pack Library (${{ matrix.pack_library.pack }})
        # Every action of the pack linked into one library, which Android and
        # iOS apps bundle (see core_types/src/pack.rs).
        if: matrix.pack_library
        shell: bash
        run: |
          python3 scripts/build_pack.py "${{ matrix.pack_library.pack }}" \
            --platform "${{ matrix.target.platform }}" --release-asset --out dist
          test -f "dist/morflow_pack_${{ matrix.pack_library.pack }}-${{ matrix.pack_library.version }}-${{ matrix.target.platform }}.${{ matrix.target.ext }}"

      - name: Build Action Binary (${{ matrix.action.name }})
        if: matrix.action
        shell: bash
        run: |
          cargo build --release --manifest-path "${{ matrix.action.path }}/Cargo.toml" --target "${{ matrix.target.triple }}"
          mkdir -p dist
          EXT="${{ matrix.target.ext }}"
          PREFIX="${{ matrix.target.prefix }}"
          SRC_FILE="target/${{ matrix.target.triple }}/release/${PREFIX}${{ matrix.action.library }}.${EXT}"
          if [ ! -f "$SRC_FILE" ]; then
            SRC_FILE="target/${{ matrix.target.triple }}/release/${{ matrix.action.library }}.${EXT}"
          fi
          if [ ! -f "$SRC_FILE" ]; then
            echo "Error: Built file not found at $SRC_FILE"
            ls -la "target/${{ matrix.target.triple }}/release/" || true
            exit 1
          fi
          DEST_FILE="dist/${{ matrix.action.name }}_action-${{ matrix.action.version }}-${{ matrix.target.platform }}.${EXT}"
          cp "$SRC_FILE" "$DEST_FILE"
          echo "Built artifact: $DEST_FILE"
          python3 -c 'import json,sys,tomllib; from pathlib import Path; cargo=tomllib.loads(Path(sys.argv[1]).read_text()); Path(sys.argv[2]).write_bytes(json.dumps({"plugins":cargo["package"].get("metadata",{}).get("morflow",{}).get("plugins",[])},indent=2).encode())' "${{ matrix.action.path }}/Cargo.toml" "dist/${{ matrix.action.name }}_METADATA.json"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "pack-${{ matrix.action.pack || matrix.pack_library.pack }}-${{ matrix.action.version || matrix.pack_library.version }}-${{ matrix.action.name || 'pack-library' }}-${{ matrix.target.platform }}"
          path: dist/*
          retention-days: 1

  publish-packs:
    name: Publish Release (action_packs/${{ matrix.pack.name }})
    needs: [detect-actions, build-action]
    if: needs.detect-actions.outputs.has_actions == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pack: ${{ fromJson(needs.detect-actions.outputs.packs) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Pack Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "pack-${{ matrix.pack.name }}-${{ matrix.pack.version }}-*"
          path: release_assets/
          merge-multiple: true

      - name: Include Action SPEC.md Documentation
        run: |
          for action_dir in actions/${{ matrix.pack.name }}/*; do
            if [ -d "$action_dir" ] && [ -f "$action_dir/SPEC.md" ]; then
              version=$(python3 -c 'import sys,tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["version"])' "$action_dir/Cargo.toml")
              [ "$version" = "${{ matrix.pack.version }}" ] || continue
              act_name=$(basename "$action_dir")
              cp "$action_dir/SPEC.md" "release_assets/${act_name}_SPEC.md"
              echo "Included release SPEC: release_assets/${act_name}_SPEC.md"
            fi
          done

      - name: Include Previously Published Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="action_packs/${{ matrix.pack.name }}/v${{ matrix.pack.version }}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            mkdir -p previous_assets
            gh release download "$TAG_NAME" --dir previous_assets
            python3 scripts/merge_release_assets.py previous_assets release_assets
          fi

      - name: Generate Checksums
        run: |
          cd release_assets
          find . -maxdepth 1 -type f ! -name checksums.txt -printf '%f\n' | sort | xargs sha256sum > checksums.txt
          echo "Generated checksums:"
          cat checksums.txt

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="action_packs/${{ matrix.pack.name }}/v${{ matrix.pack.version }}"
          RELEASE_TITLE="Action Pack: ${{ matrix.pack.name }} v${{ matrix.pack.version }}"
          
          echo "Publishing to tag $TAG_NAME..."
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME exists. Uploading new/updated assets..."
            gh release upload "$TAG_NAME" release_assets/* --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" release_assets/* \
              --title "$RELEASE_TITLE" \
              --notes "Precompiled cross-platform dynamic libraries (.so, .dylib, .dll) for Linux (x86_64, aarch64), macOS (Apple Silicon) and Windows (x86_64) for **${{ matrix.pack.name }}** Action Pack v${{ matrix.pack.version }}, plus the pack library (every action in one library) for Android and iOS apps when the pack needs no plugin."
          fi

  trigger-next-batch:
    name: Trigger Next Batch (${{ needs.detect-actions.outputs.remaining_count }} remaining)
    needs: [detect-actions, publish-packs]
    if: needs.detect-actions.outputs.has_more == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger subsequent batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Remaining actions to build: ${{ needs.detect-actions.outputs.remaining_count }}"
          echo "Triggering next batch of actions via workflow dispatch..."
          if gh workflow run build-actions.yml --ref "${{ github.ref_name }}"; then
            echo "✓ Successfully triggered subsequent batch."
          else
            echo "::notice ::Automatic workflow dispatch could not be triggered. Please trigger the workflow dispatch manually to build the remaining ${{ needs.detect-actions.outputs.remaining_count }} actions."
          fi
