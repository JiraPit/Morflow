name: Build and Release Engine

# Builds and releases the engine version in pipeline/Cargo.toml only when it
# has no GitHub release yet, the same rule action packs and plugins follow.
on:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'core_types/**'
      - 'parser/**'
      - 'bindings/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-engine.yml'
      - 'scripts/detect_engine_version.py'
      - 'scripts/package-node.mjs'
      - 'scripts/publish-node.mjs'
      - 'scripts/publish_crates.py'
      - 'scripts/publish_maven.py'
      - 'scripts/build_capi.py'
      - 'scripts/native_targets.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-engine:
    name: Detect Engine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detector.outputs.version }}
      tag_name: ${{ steps.detector.outputs.tag_name }}
      should_build: ${{ steps.detector.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Version Detector
        id: detector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/detect_engine_version.py --repo "${{ github.repository }}"

  build-rust-packages:
    name: Verify Rust release packages
    needs: detect-engine
    if: needs.detect-engine.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify all three crates
        run: cargo publish --dry-run --locked -p morflow-core-types -p morflow-parser -p morflow

      - name: Upload Rust packages
        uses: actions/upload-artifact@v4
        with:
          name: engine-rust
          path: |
            target/package/tmp-crate/morflow-core-types-*.crate
            target/package/tmp-crate/morflow-parser-*.crate
            target/package/tmp-crate/morflow-0*.crate
          if-no-files-found: error
          retention-days: 7

  build-core:
    name: Build Core (${{ matrix.platform }})
    needs: detect-engine
    if: needs.detect-engine.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            bin_name: morflow
            target_bin: morflow
            archive_ext: tar.gz
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            bin_name: morflow
            target_bin: morflow
            archive_ext: tar.gz
          - os: macos-latest
            triple: aarch64-apple-darwin
            platform: darwin-arm64
            bin_name: morflow
            target_bin: morflow
            archive_ext: tar.gz
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bin_name: morflow.exe
            target_bin: morflow.exe
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Build CLI Binary
        shell: bash
        run: |
          cargo build --release -p morflow --target "${{ matrix.triple }}"
          mkdir -p dist/bin
          SRC="target/${{ matrix.triple }}/release/${{ matrix.bin_name }}"
          if [ ! -f "$SRC" ]; then
            SRC="target/${{ matrix.triple }}/release/${{ matrix.target_bin }}"
          fi
          if [ ! -f "$SRC" ]; then
            SRC="target/release/${{ matrix.bin_name }}"
          fi
          DEST="dist/bin/${{ matrix.target_bin }}"
          cp "$SRC" "$DEST"
          
          VERSION="${{ needs.detect-engine.outputs.version }}"
          ARCHIVE_NAME="morflow-v${VERSION}-${{ matrix.platform }}"
          
          cd dist/bin
          if [ "${{ matrix.archive_ext }}" = "tar.gz" ]; then
            tar -czf "../${ARCHIVE_NAME}.tar.gz" "${{ matrix.target_bin }}"
          else
            7z a "../${ARCHIVE_NAME}.zip" "${{ matrix.target_bin }}"
          fi

      - name: Upload CLI Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "engine-cli-${{ matrix.platform }}"
          path: dist/*.${{ matrix.archive_ext }}
          retention-days: 7

  build-python-wheels:
    # The extension uses the stable ABI (abi3-py38), so one wheel per platform
    # covers every CPython >= 3.8.
    name: Build Python Wheel (${{ matrix.platform }})
    needs: detect-engine
    if: needs.detect-engine.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            platform: darwin-arm64
            target: aarch64-apple-darwin
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build portable Linux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: '2_28'
          before-script-linux: |
            dnf install -y openssl-devel pkgconf-pkg-config
            pkg-config --modversion openssl
          args: >-
            --release --locked --manifest-path bindings/python/Cargo.toml
            --out dist_python --interpreter /opt/python/cp312-cp312/bin/python

      - name: Build macOS or Windows wheel
        if: runner.os != 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: >-
            --release --locked --manifest-path bindings/python/Cargo.toml
            --out dist_python --interpreter python

      - name: Verify installed wheel
        shell: bash
        run: |
          python -m pip install --only-binary=:all: dist_python/*.whl
          cd "$RUNNER_TEMP"
          python -c "import morflow; print('Morflow wheel import succeeded')"

      - name: Upload Python Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "engine-python-${{ matrix.platform }}"
          path: dist_python/*.whl
          if-no-files-found: error
          retention-days: 7

  build-node-bindings:
    name: Build Node.js Addons (${{ matrix.platform }})
    needs: detect-engine
    if: needs.detect-engine.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64-gnu
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux-arm64-gnu
            triple: aarch64-unknown-linux-gnu
          - os: macos-latest
            platform: darwin-arm64
            triple: aarch64-apple-darwin
          - os: windows-latest
            platform: win32-x64-msvc
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Build N-API Addon
        shell: bash
        run: |
          cd bindings/js
          npm ci
          npx napi build --platform --release --target "${{ matrix.triple }}"
          mkdir -p ../../dist_node
          cp "morflow.${{ matrix.platform }}.node" ../../dist_node/
          node -e "require('./index.js')"
          node bin/morflow.mjs --version

      - name: Upload Node Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "engine-node-${{ matrix.platform }}"
          path: dist_node/*
          retention-days: 7

  package-node:
    name: Package Node.js release
    needs: [detect-engine, build-node-bindings]
    if: needs.detect-engine.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download native addons
        uses: actions/download-artifact@v4
        with:
          pattern: engine-node-*
          path: node_artifacts/
          merge-multiple: true

      - name: Package all supported platforms
        run: node scripts/package-node.mjs node_artifacts dist_npm

      - name: Verify installed package
        run: |
          mkdir -p "$RUNNER_TEMP/morflow-npm-test"
          npm install --prefix "$RUNNER_TEMP/morflow-npm-test" --ignore-scripts ./dist_npm/*.tgz
          cd "$RUNNER_TEMP/morflow-npm-test"
          node -e "require('morflow')"
          node node_modules/morflow/bin/morflow.mjs --version

      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: engine-npm
          path: dist_npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  build-java-bindings:
    name: Build Java JAR & JNI (${{ matrix.platform }})
    needs: detect-engine
    if: needs.detect-engine.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            lib_prefix: lib
            lib_ext: so
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            triple: aarch64-unknown-linux-gnu
            lib_prefix: lib
            lib_ext: so
          - os: macos-latest
            platform: darwin-arm64
            triple: aarch64-apple-darwin
            lib_prefix: lib
            lib_ext: dylib
          - os: windows-latest
            platform: windows-x86_64
            triple: x86_64-pc-windows-msvc
            lib_prefix: ""
            lib_ext: dll
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Build Java JNI Native Library
        shell: bash
        run: |
          cargo build --release -p morflow-jni --target "${{ matrix.triple }}"
          mkdir -p dist_java
          SRC="target/${{ matrix.triple }}/release/${{ matrix.lib_prefix }}morflow_jni.${{ matrix.lib_ext }}"
          if [ ! -f "$SRC" ]; then
            SRC="target/${{ matrix.triple }}/release/morflow_jni.${{ matrix.lib_ext }}"
          fi
          cp "$SRC" "dist_java/libmorflow_jni-${{ matrix.platform }}.${{ matrix.lib_ext }}"

      - name: Upload Java Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "engine-java-${{ matrix.platform }}"
          path: dist_java/*
          retention-days: 7

  package-java:
    # One JAR bundles every platform's JNI library under native/<platform>/,
    # where NativeLoader looks for it. The GitHub release and Maven Central
    # receive the same files.
    name: Package Java JAR
    needs: [detect-engine, build-java-bindings]
    if: needs.detect-engine.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download JNI libraries
        uses: actions/download-artifact@v4
        with:
          pattern: engine-java-*
          path: jni/
          merge-multiple: true

      - name: Bundle JNI libraries into the JAR
        shell: bash
        run: |
          VERSION="${{ needs.detect-engine.outputs.version }}"
          POM_VERSION=$(mvn -B -q -f bindings/java/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$POM_VERSION" != "$VERSION" ]; then
            echo "bindings/java/pom.xml is $POM_VERSION but the engine is $VERSION" >&2
            exit 1
          fi
          RES=bindings/java/src/main/resources/native
          mkdir -p "$RES"/{linux-x64,linux-aarch64,macos-aarch64,windows-x64}
          cp jni/libmorflow_jni-linux-x86_64.so "$RES/linux-x64/libmorflow_jni.so"
          cp jni/libmorflow_jni-linux-aarch64.so "$RES/linux-aarch64/libmorflow_jni.so"
          cp jni/libmorflow_jni-darwin-arm64.dylib "$RES/macos-aarch64/libmorflow_jni.dylib"
          cp jni/libmorflow_jni-windows-x86_64.dll "$RES/windows-x64/morflow_jni.dll"
          (cd bindings/java && mvn -B package -DskipTests)
          JAR="bindings/java/target/morflow-${VERSION}.jar"
          test "$(unzip -l "$JAR" | grep -cE 'native/[a-z0-9-]+/(lib)?morflow_jni\.(so|dylib|dll)$')" -eq 4

      - name: Verify the JAR loads its bundled native library
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/java-smoke" && cd "$RUNNER_TEMP/java-smoke"
          cat > Check.java <<'JAVA'
          import org.morflow.Morflow;
          import org.morflow.MorflowException;
          public class Check {
              public static void main(String[] args) {
                  try {
                      Morflow.fromString("not a valid pipeline ((");
                      throw new AssertionError("invalid pipeline was accepted");
                  } catch (MorflowException expected) {
                      System.out.println("Bundled native library loaded and ran");
                  }
              }
          }
          JAVA
          java -Djava.library.path=/nonexistent \
            -cp "$GITHUB_WORKSPACE/bindings/java/target/morflow-${{ needs.detect-engine.outputs.version }}.jar" Check.java

      - name: Collect release files
        shell: bash
        run: |
          VERSION="${{ needs.detect-engine.outputs.version }}"
          mkdir -p dist_jar maven_bundle
          cp "bindings/java/target/morflow-${VERSION}.jar" dist_jar/
          cp bindings/java/target/morflow-${VERSION}{,-sources,-javadoc}.jar maven_bundle/
          cp bindings/java/pom.xml "maven_bundle/morflow-${VERSION}.pom"

      - name: Upload JAR for the GitHub release
        uses: actions/upload-artifact@v4
        with:
          name: engine-java-jar
          path: dist_jar/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload Maven Central bundle
        uses: actions/upload-artifact@v4
        with:
          name: maven-bundle
          path: maven_bundle/*
          if-no-files-found: error
          retention-days: 7

  build-capi:
    # The C interface library the Dart package downloads from this release,
    # for desktop and for Android and iOS apps.
    name: Build C interface (${{ matrix.platform }})
    needs: detect-engine
    if: needs.detect-engine.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-latest, triple: x86_64-unknown-linux-gnu }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu }
          - { platform: darwin-arm64, os: macos-latest, triple: aarch64-apple-darwin }
          # For universal macOS apps; cross-compiled on Apple Silicon.
          - { platform: darwin-x86_64, os: macos-latest, triple: x86_64-apple-darwin }
          - { platform: windows-x86_64, os: windows-latest, triple: x86_64-pc-windows-msvc }
          - { platform: android-aarch64, os: ubuntu-latest, triple: aarch64-linux-android }
          - { platform: android-x86_64, os: ubuntu-latest, triple: x86_64-linux-android }
          - { platform: ios-arm64, os: macos-latest, triple: aarch64-apple-ios }
          - { platform: ios-arm64-sim, os: macos-latest, triple: aarch64-apple-ios-sim }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the library
        shell: bash
        run: python3 scripts/build_capi.py --platform "${{ matrix.platform }}" --release-asset --out dist_capi

      - name: Upload C interface artifact
        uses: actions/upload-artifact@v4
        with:
          name: "engine-capi-${{ matrix.platform }}"
          path: dist_capi/*
          if-no-files-found: error
          retention-days: 7

  test-dart:
    # The Dart package and the C interface behind it. Every platform runs the
    # tests that need no actions; Linux x86_64 also builds every action from
    # source and runs both suites in full.
    name: Test Dart package (${{ matrix.platform }})
    needs: detect-engine
    if: needs.detect-engine.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            full: true
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            full: false
          - os: macos-latest
            platform: darwin-arm64
            full: false
          - os: windows-latest
            platform: windows-x86_64
            full: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build every action into a test cache
        if: matrix.full
        shell: bash
        run: |
          packages=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); from pathlib import Path; from detect_changed_actions import discover_all_actions; print(" ".join("-p " + a["package"] for a in discover_all_actions(Path("."))))')
          cargo build --release --locked $packages
          python3 scripts/prepare_test_actions.py --profile release --cache "$RUNNER_TEMP/actions"
          echo "MORFLOW_ACTIONS_PATH=$RUNNER_TEMP/actions" >> "$GITHUB_ENV"

      - name: Test the C interface
        shell: bash
        run: cargo test --release --locked -p morflow-capi

      - name: Analyze the Dart package
        working-directory: bindings/dart
        # example/ is a Flutter app, and this job has only the Dart SDK.
        run: |
          dart pub get --no-example
          dart format --output=none --set-exit-if-changed lib hook test
          dart analyze --fatal-infos lib hook test

      - name: Test the Dart package
        working-directory: bindings/dart
        run: dart test --reporter expanded

  publish-engine-release:
    name: Publish GitHub Release (${{ needs.detect-engine.outputs.tag_name }})
    needs: [detect-engine, build-rust-packages, build-core, build-python-wheels, build-node-bindings, package-node, build-java-bindings, package-java, build-capi, test-dart]
    if: needs.detect-engine.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all Engine artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/
          pattern: "engine-*"
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release_assets
          sha256sum * > checksums.txt
          echo "Release Assets Checksums:"
          cat checksums.txt

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.detect-engine.outputs.tag_name }}"
          VERSION="${{ needs.detect-engine.outputs.version }}"
          TITLE="Morflow Engine & Bindings v${VERSION}"
          
          echo "Publishing release $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running a failed publish job reuses this run's artifacts, so
            # the files match. A rebuild never replaces published files.
            echo "Release $TAG exists. Adding missing assets..."
            mkdir -p previous_assets
            gh release download "$TAG" --dir previous_assets
            python3 scripts/merge_release_assets.py previous_assets release_assets
            (cd release_assets && find . -maxdepth 1 -type f ! -name checksums.txt -printf '%f\n' | sort | xargs sha256sum > checksums.txt)
            gh release upload "$TAG" release_assets/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release_assets/* \
              --title "$TITLE" \
              --notes "Official release of **Morflow Engine & Language Bindings** v${VERSION}. Includes multi-platform CLI binaries, Python wheels, Node.js packages, a Java JAR bundling the JNI libraries for every platform, and the C interface library (libmorflow_capi) the Dart package downloads, for desktop, Android and iOS."
          fi

  publish-pypi:
    name: Publish Python package to PyPI
    needs: [detect-engine, publish-engine-release]
    if: needs.detect-engine.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/morflow
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python wheels
        uses: actions/download-artifact@v4
        with:
          pattern: engine-python-*
          path: dist/
          merge-multiple: true

      - name: Publish wheels using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Allow retrying a partially completed release without replacing published files.
          skip-existing: true

  publish-npm:
    name: Publish Node.js package to npm
    needs: [detect-engine, publish-engine-release]
    if: needs.detect-engine.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11

      - name: Download npm release package
        uses: actions/download-artifact@v4
        with:
          name: engine-npm
          path: dist_npm/

      - name: Publish verified package
        run: node scripts/publish-node.mjs dist_npm/*.tgz

  publish-maven:
    name: Publish Java package to Maven Central
    needs: [detect-engine, publish-engine-release]
    if: needs.detect-engine.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Maven bundle
        uses: actions/download-artifact@v4
        with:
          name: maven-bundle
          path: maven_bundle/

      - name: Import signing key
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: printf '%s\n' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Sign, upload and wait for validation
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: python3 scripts/publish_maven.py maven_bundle --version "${{ needs.detect-engine.outputs.version }}"

  publish-rust:
    name: Publish Rust crates to crates.io
    needs: [detect-engine, publish-engine-release]
    if: needs.detect-engine.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Select unpublished crate versions
        id: crates
        run: python scripts/publish_crates.py

      - name: Authenticate using Trusted Publishing
        if: steps.crates.outputs.pending == 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crates in dependency order
        if: steps.crates.outputs.pending == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python scripts/publish_crates.py --publish
