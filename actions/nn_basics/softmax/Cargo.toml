[package]
publish = false
name = "softmax"
version = "0.4.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
core_types = { package = "morflow-core-types", version = "0.4.3", path = "../../../core_types" }
rayon = "1.10"

[lints.rust]
# Set when this action is linked into a pack library (core_types::pack).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(morflow_pack)'] }
