[package]
publish = false
name = "linalg_blas_matmul"
version = "0.1.2"
edition = "2021"

[package.metadata.morflow]
action = "matmul"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
core_types = { package = "morflow-core-types", version = "0.4.2", path = "../../../core_types" }

[[package.metadata.morflow.plugins]]
name = "openblas"
version = "^0.1.0"

[dev-dependencies]
openblas-plugin = { package = "morflow-plugin-openblas", path = "../../../plugins/openblas" }
