name: morflow
description: >-
  Data processing and tensor transformation engine. Run declarative .morf
  pipelines over tensors, images and audio with native performance.
version: 0.3.2
homepage: https://morflow.org
repository: https://github.com/JiraPit/Morflow/tree/main/bindings/dart
issue_tracker: https://github.com/JiraPit/Morflow/issues
topics: [tensor, audio, image, pipeline, ffi]

environment:
  sdk: ^3.10.0

platforms:
  linux:
  macos:
  windows:

dependencies:
  code_assets: ^2.2.0
  crypto: ^3.0.6
  ffi: ^2.1.0
  hooks: ^2.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
