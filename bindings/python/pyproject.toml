[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "morflow"
version = "0.2.1"
description = "High-performance modular dataflow pipeline engine for media and tensor computing"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
]

[project.scripts]
morflow = "morflow.cli:main"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "morflow._morflow"
