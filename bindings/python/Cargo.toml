[package]
publish = false
name = "morflow-py"
version = "0.3.3"
edition = "2021"

[lib]
name = "_morflow"
crate-type = ["cdylib", "rlib"]

[dependencies]
# abi3: one wheel per platform works on every CPython >= 3.8.
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
numpy = "0.23"
morflow = { package = "morflow", version = "0.3.3", path = "../../pipeline" }
core_types = { package = "morflow-core-types", version = "0.4.3", path = "../../core_types" }
abi_stable = "0.11"
