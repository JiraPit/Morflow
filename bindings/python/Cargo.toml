[package]
publish = false
name = "morflow-py"
version = "0.2.6"
edition = "2021"

[lib]
name = "_morflow"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
morflow = { package = "morflow", version = "0.2.6", path = "../../pipeline" }
core_types = { package = "morflow-core-types", version = "0.4.2", path = "../../core_types" }
abi_stable = "0.11"
