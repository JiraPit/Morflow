[package]
publish = false
name = "morflow-capi"
version = "0.3.2"
edition = "2021"
description = "C interface to the Morflow engine, used by the Dart package"

[lib]
name = "morflow_capi"
crate-type = ["cdylib", "rlib"]

[dependencies]
core_types = { package = "morflow-core-types", version = "0.4.3", path = "../../core_types" }
morflow = { package = "morflow", version = "0.3.2", path = "../../pipeline" }
abi_stable = "0.11"
